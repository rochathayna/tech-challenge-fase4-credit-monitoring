# Stack de observabilidade: exporter (métricas do pipeline/modelo) -> Prometheus (coleta + regras de alerta) -> Grafana
#   cd monitoring && docker compose up
#   Grafana:    http://localhost:3000   (acesso anônimo, dashboard "Credit Scoring — Observabilidade")
#   Prometheus: http://localhost:9090   (aba Alerts mostra as regras de drift disparando)
# Pré-requisito: ter rodado `make all` (ou usar as evidências já versionadas em reports/ e logs/).
services:
  exporter:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ..:/app:ro
    command: >
      sh -c "pip install -q --no-cache-dir prometheus-client &&
             python -m src.exporter --port 8000 --replay ${REPLAY_SECONDS:-15}"
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus:/etc/prometheus:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on: [exporter]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/credit-monitoring.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
